<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deutschland-Simulator</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; background: #fff; color: #111; }
      .knoepfe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
      button { min-height: 44px; padding: 6px 14px; font: inherit; cursor: pointer; }
      select { min-height: 44px; font: inherit; }
      .punkt { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; margin-right: 0.4em; border: 1px solid #888; }
      .umfrage .zeile { display: grid; grid-template-columns: 6em 1fr 8.5em; gap: 8px; align-items: center; padding: 2px 0; }
      .umfrage .eigene { font-weight: bold; }
      .balken { position: relative; height: 1em; background: #eee; }
      .balken > span { display: block; height: 100%; }
      .huerde { position: absolute; top: -2px; bottom: -2px; border-left: 2px dashed #c00; }
      .wert { text-align: right; font-variant-numeric: tabular-nums; }
      .partner { display: grid; grid-template-columns: auto 1fr auto 7.5em; gap: 8px; align-items: center; min-height: 44px; }
      .partner > span:last-child { text-align: right; }
      .partner.gesperrt { color: #666; } /* #888 hatte nur 3,5:1 Kontrast auf Weiß */
      .partner input { width: 22px; height: 22px; }
      .kombi { display: grid; grid-template-columns: 1fr auto 7.5em auto; gap: 8px; align-items: center; min-height: 44px; }
      .kombi > span:nth-child(3) { text-align: right; }
      .wahlergebnis { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      .wahlergebnis th, .wahlergebnis td { padding: 3px 6px; border-bottom: 1px solid #eee; text-align: right; }
      .wahlergebnis th[scope="row"], .wahlergebnis th:first-child { text-align: left; font-weight: normal; }
      .wahlergebnis .eigene th, .wahlergebnis .eigene td { font-weight: bold; }
      @media (max-width: 500px) { .kombi { grid-template-columns: 1fr auto; } }
      button:disabled { cursor: not-allowed; }
      .ministerien { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 16px; }
      .ministerium { display: grid; grid-template-columns: 1fr 9em; gap: 8px; align-items: center; }
      .ministerium select { min-width: 0; }
      .fehler { color: #b00; }
      .posten { display: grid; grid-template-columns: 1fr auto 44px 44px; gap: 6px; align-items: center; padding: 2px 0; }
      .posten button { padding: 0; font-size: 1.2em; }
      /* Grenze erreicht: aria-disabled statt disabled, damit der Fokus auf dem Knopf bleiben kann */
      .posten button[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; }
      .betrag { text-align: right; font-variant-numeric: tabular-nums; }
      .bilanz { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-variant-numeric: tabular-nums; }
      .bilanz > span:nth-child(even) { text-align: right; }
      .ok { color: #070; font-weight: bold; }
      .bundesrat, .abstimmung { margin: 16px 0; }
      .bundesrat summary, .abstimmung summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: bold; }
      .land { display: grid; grid-template-columns: 1fr 1fr 2em 6.5em; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px solid #eee; }
      .land > span:nth-child(3), .land > span:nth-child(4) { text-align: right; }
      @media (max-width: 500px) {
        .land { grid-template-columns: 1fr auto 2em 6.5em; }
        .land > span:nth-child(2) small { display: none; }
      }
      .rot { color: #b00; font-weight: bold; }
      .problem { border-top: 1px solid #ddd; padding: 8px 0; }
      .problemkopf { display: flex; justify-content: space-between; gap: 8px; font-weight: bold; }
      .problemkopf > span:last-child { white-space: nowrap; }
      .problem > .balken { display: block; margin: 4px 0 8px; }
      .reform { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 4px 0 4px 12px; }
      .reform .abstimmung { grid-column: 1 / -1; margin: 0; }
      .reform.gesperrt { color: #666; }
      .ereignis { background: #fff6e5; border-left: 4px solid #c80; padding: 4px 12px 10px; margin: 8px 0 16px; }
      .ereignis button { text-align: left; }
      .gelb { color: #8a5a00; font-weight: bold; }
      /* nur für Screenreader sichtbar */
      .nur-screenreader { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .partei-wahl { display: inline-flex; flex-direction: column; align-items: flex-start; text-align: left; }
      .partei-wahl small { color: #555; }
      .teilen { display: flex; gap: 8px; }
      .teilen input { flex: 1; min-width: 0; min-height: 44px; font: inherit; padding: 0 8px; }
      .verlauf { width: 100%; max-width: 640px; height: auto; display: block; }
      .verlauf text { font-size: 11px; fill: #555; }
      .verlauf .huerde-linie { stroke: #b00; stroke-dasharray: 4 3; stroke-width: 1; }
      .hinweis { background: #f3f6fa; border-left: 4px solid #5577aa; padding: 4px 12px 10px; margin: 8px 0 16px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ansage" aria-live="polite" class="nur-screenreader"></div>
    <script type="module" src="/src/ui/app.js"></script>
  </body>
</html>
